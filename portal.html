document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #C29A4E; margin-bottom: 12px;\">Your Tasks<\u002Fp>\n                <ul style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); line-height: 1.8; list-style: none; padding: 0;\">\n                  <li>✓ Share favorite moments with us<\u002Fli>\n                  <li>✓ Receive your photography gallery<\u002Fli>\n                  <li>✓ Preserve your keepsakes<\u002Fli>\n                  <li>✓ Reflect on the memory<\u002Fli>\n                <\u002Ful>\n              <\u002Fdiv>\n              <div>\n                <p style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #C29A4E; margin-bottom: 12px;\">Our Tasks<\u002Fp>\n                <ul style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); line-height: 1.8; list-style: none; padding: 0;\">\n                  <li>✓ Send a heartfelt thank-you<\u002Fli>\n                  <li>✓ Deliver keepsake &amp; photo guidance<\u002Fli>\n                  <li>✓ Return or reconcile rentals<\u002Fli>\n                  <li>✓ Hold space for your next milestone<\u002Fli>\n                <\u002Ful>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Payments Tab -->\n      <div id=\"payments\" class=\"tab-content\" style=\"display: none;\">\n        <h2 style=\"font-family: 'Newsreader', serif; font-size: 28px; color: #FBF6EC; margin-bottom: 30px;\">Payments &amp; Invoices<\u002Fh2>\n        <div style=\"background: rgba(194, 154, 78, 0.08); border: 1px solid rgba(194, 154, 78, 0.16); padding: 30px; border-radius: 2px; margin-bottom: 30px;\">\n          <div id=\"payment-summary\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 30px;\">\n            <div>\n              <p style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245, 237, 221, 0.6); margin-bottom: 12px;\">Total Cost<\u002Fp>\n              <p id=\"total-cost\" style=\"font-size: 28px; color: #FBF6EC; font-weight: 600;\">$15,000.00<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245, 237, 221, 0.6); margin-bottom: 12px;\">Amount Paid<\u002Fp>\n              <p id=\"amount-paid\" style=\"font-size: 28px; color: #C29A4E; font-weight: 600;\">$7,500.00<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245, 237, 221, 0.6); margin-bottom: 12px;\">Balance Due<\u002Fp>\n              <p id=\"balance-due\" style=\"font-size: 28px; color: #FFB3B3; font-weight: 600;\">$7,500.00<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"font-size: 16px; color: #FBF6EC; margin-bottom: 16px;\">Payment History<\u002Fh3>\n        <div style=\"text-align: center; padding: 40px 20px; color: rgba(245, 237, 221, 0.5);\">\n          <p style=\"font-size: 14px;\">No payments recorded yet.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Revisions Tab -->\n      <div id=\"revisions\" class=\"tab-content\" style=\"display: none;\">\n        <h2 style=\"font-family: 'Newsreader', serif; font-size: 28px; color: #FBF6EC; margin-bottom: 30px;\">Revision Requests<\u002Fh2>\n        \n        <div style=\"max-width: 700px; margin-bottom: 40px;\">\n          <h3 style=\"font-size: 16px; color: #FBF6EC; margin-bottom: 16px;\">How This Works<\u002Fh3>\n          <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); line-height: 1.8; margin-bottom: 20px;\">Refining a design is a natural, welcome part of our process. To keep your changes clear — and to make sure nothing is lost across messages — we ask that all revisions come through our form. One form per revision round keeps everything organized and lets us respond thoughtfully rather than piecemeal.<\u002Fp>\n          \n          <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 12px;\">What Counts as a Revision<\u002Fh3>\n          <ul style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); line-height: 1.8; list-style: none; padding: 0; margin-bottom: 20px;\">\n            <li>• Adjusting an approved color, material, or detail<\u002Fli>\n            <li>• Swapping an element for another within scope<\u002Fli>\n            <li>• Refining layout, quantities, or styling<\u002Fli>\n            <li>• Copy or wording changes on signage<\u002Fli>\n          <\u002Ful>\n          \n          <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 12px;\">What Is a New Request<\u002Fh3>\n          <ul style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); line-height: 1.8; list-style: none; padding: 0; margin-bottom: 20px;\">\n            <li>• Adding elements beyond the approved design<\u002Fli>\n            <li>• Changing guest count, date, or venue<\u002Fli>\n            <li>• A full change of direction or concept<\u002Fli>\n            <li>• Requests after final approval<\u002Fli>\n          <\u002Ful>\n          \n          <p style=\"font-size: 12px; color: rgba(245, 237, 221, 0.6); font-style: italic;\">These are welcomed too — we'll simply quote them separately.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background: rgba(194, 154, 78, 0.08); border: 1px solid rgba(194, 154, 78, 0.16); padding: 30px; border-radius: 2px; margin-bottom: 30px;\">\n          <h3 style=\"font-size: 16px; color: #FBF6EC; margin-bottom: 16px;\">Submit Your Revision<\u002Fh3>\n          <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); line-height: 1.8; margin-bottom: 20px;\">To submit a revision request, please:<\u002Fp>\n          <ol style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); line-height: 1.8; list-style: none; padding: 0; margin-left: 0;\">\n            <li style=\"margin-bottom: 12px;\"><strong>1. Download the Revision Request Form<\u002Fstrong> from your <a href=\"#documents\" style=\"color: #C29A4E;\">Documents<\u002Fa> tab (look for \"Revision Request Form\")<\u002Fli>\n            <li style=\"margin-bottom: 12px;\"><strong>2. Complete the form<\u002Fstrong> with your requested changes and details<\u002Fli>\n            <li><strong>3. Email the completed form<\u002Fstrong> to <a href=\"mailto:janetv@momentscurated.com\" style=\"color: #C29A4E;\">janetv@momentscurated.com<\u002Fa><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n\n        <div style=\"text-align: center; padding: 20px; color: rgba(245, 237, 221, 0.6);\">\n          <p style=\"font-size: 12px;\">Your revision rounds are outlined in your proposal. We'll review each request and respond thoughtfully.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Event Details Tab -->\n      <div id=\"event\" class=\"tab-content\" style=\"display: none;\">\n        <h2 style=\"font-family: 'Newsreader', serif; font-size: 28px; color: #FBF6EC; margin-bottom: 30px;\">Event Details<\u002Fh2>\n        <div style=\"background: rgba(194, 154, 78, 0.08); border: 1px solid rgba(194, 154, 78, 0.16); padding: 30px; border-radius: 2px;\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px;\">\n            <div>\n              <p style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245, 237, 221, 0.6); margin-bottom: 8px;\">Event Date<\u002Fp>\n              <p style=\"font-size: 16px; color: #FBF6EC;\">TBD<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245, 237, 221, 0.6); margin-bottom: 8px;\">Venue<\u002Fp>\n              <p style=\"font-size: 16px; color: #FBF6EC;\">TBD<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245, 237, 221, 0.6); margin-bottom: 8px;\">Guest Count<\u002Fp>\n              <p style=\"font-size: 16px; color: #FBF6EC;\">TBD<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245, 237, 221, 0.6); margin-bottom: 8px;\">Event Type<\u002Fp>\n              <p style=\"font-size: 16px; color: #FBF6EC;\">TBD<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Help & FAQ Tab -->\n      <div id=\"faq\" class=\"tab-content\" style=\"display: none;\">\n        <h2 style=\"font-family: 'Newsreader', serif; font-size: 28px; color: #FBF6EC; margin-bottom: 30px;\">Help &amp; FAQ<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <div style=\"border-bottom: 1px solid rgba(194, 154, 78, 0.16); padding-bottom: 20px;\">\n            <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 8px; cursor: pointer;\">How long does the design process take?<\u002Fh3>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.7); display: none;\">Typically 4-6 weeks depending on the complexity of your event and the number of revisions requested.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-bottom: 1px solid rgba(194, 154, 78, 0.16); padding-bottom: 20px;\">\n            <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 8px; cursor: pointer;\">How many revisions are included?<\u002Fh3>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.7); display: none;\">Revision rounds are outlined in your proposal. Additional revisions beyond what's included are available—we'll simply quote them separately to keep everything transparent.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-bottom: 1px solid rgba(194, 154, 78, 0.16); padding-bottom: 20px;\">\n            <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 8px; cursor: pointer;\">What's your payment schedule?<\u002Fh3>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.7); display: none;\">Typically 50% deposit to secure your date, with the remainder due before event delivery.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-bottom: 1px solid rgba(194, 154, 78, 0.16); padding-bottom: 20px;\">\n            <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 8px; cursor: pointer;\">Can I request custom changes?<\u002Fh3>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.7); display: none;\">Absolutely. Use the Revision Request form to submit any changes or additions you'd like to see.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-bottom: 1px solid rgba(194, 154, 78, 0.16); padding-bottom: 20px;\">\n            <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 8px; cursor: pointer;\">What if I need to change my event date or details?<\u002Fh3>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.7); display: none;\">We understand plans can shift. Contact us as soon as possible — depending on timing and scope, we'll work with you on adjustments and any impact to your timeline or investment.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-bottom: 1px solid rgba(194, 154, 78, 0.16); padding-bottom: 20px;\">\n            <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 8px; cursor: pointer;\">What happens after the design is approved?<\u002Fh3>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.7); display: none;\">Once you give final approval, we move into production and coordination. You'll receive a Final Details Packet, confirm vendors, and we'll prepare everything for your event day setup and styling.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-bottom: 1px solid rgba(194, 154, 78, 0.16); padding-bottom: 20px;\">\n            <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 8px; cursor: pointer;\">Can you work with my existing vendors?<\u002Fh3>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.7); display: none;\">Yes, absolutely. We collaborate with your florist, caterer, venue, and other vendors to bring the design to life seamlessly. Just let us know who you're working with early on.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-bottom: 1px solid rgba(194, 154, 78, 0.16); padding-bottom: 20px;\">\n            <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 8px; cursor: pointer;\">Do you offer rush timelines?<\u002Fh3>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.7); display: none;\">We prefer to work with adequate lead time to deliver our best work. That said, expedited timelines may be possible — we'll quote separately to reflect the accelerated schedule.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-bottom: 1px solid rgba(194, 154, 78, 0.16); padding-bottom: 20px;\">\n            <h3 style=\"font-size: 14px; color: #C29A4E; margin-bottom: 8px; cursor: pointer;\">What's included in the final delivery?<\u002Fh3>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.7); display: none;\">Your deliverables are outlined in your proposal and may include design files, printed materials, production coordination, event day styling, and a curated photo gallery after your celebration.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Contact Tab -->\n      <div id=\"contact\" class=\"tab-content\" style=\"display: none;\">\n        <h2 style=\"font-family: 'Newsreader', serif; font-size: 28px; color: #FBF6EC; margin-bottom: 30px;\">Get in Touch<\u002Fh2>\n        <div style=\"max-width: 500px;\">\n          <div style=\"background: rgba(194, 154, 78, 0.08); border: 1px solid rgba(194, 154, 78, 0.16); padding: 30px; border-radius: 2px; margin-bottom: 30px;\">\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); margin-bottom: 20px;\">Have questions or need to reach us? We're here to help.<\u002Fp>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); margin-bottom: 16px;\">\n              <strong>Email:<\u002Fstrong> <a href=\"mailto:hello@momentscurated.com\">hello@momentscurated.com<\u002Fa>\n            <\u002Fp>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8); margin-bottom: 16px;\">\n              <strong>Phone:<\u002Fstrong> 305-767-9307\n            <\u002Fp>\n            <p style=\"font-size: 13px; color: rgba(245, 237, 221, 0.8);\">\n              <strong>Location:<\u002Fstrong> South Florida\n            <\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { loggedIn: false, clientName: '', clientEmail: '', documents: [], payments: { total_cost: 0, amount_paid: 0, balance_due: 0 } };\n\n  SUPABASE_URL = 'https://utexshecgxsvbcadxzno.supabase.co';\n  SUPABASE_KEY = 'sb_publishable_Mhm44wbybWdLP6E5x5QOCw_0Cz_6MGt';\n\n  componentDidMount() {\n    const stored = localStorage.getItem('mc_client_session');\n    if (stored) {\n      const session = JSON.parse(stored);\n      this.setState({ loggedIn: true, clientName: session.name, clientEmail: session.email, documents: session.documents || [] });\n      this.loadDocuments(session.email);\n      this.loadPayments(session.email);\n    }\n\n    const loginForm = document.getElementById('login-form');\n    const logoutBtn = document.getElementById('logout-btn');\n    const togglePasswordBtn = document.getElementById('toggle-password');\n    \n    if (loginForm) {\n      loginForm.addEventListener('submit', (e) => this.handleLogin(e));\n    }\n    if (logoutBtn) {\n      logoutBtn.addEventListener('click', () => this.handleLogout());\n    }\n    if (togglePasswordBtn) {\n      togglePasswordBtn.addEventListener('click', (e) => this.togglePasswordVisibility(e));\n    }\n\n    // Tab switching\n    const tabButtons = document.querySelectorAll('.tab-btn');\n    tabButtons.forEach(btn => {\n      btn.addEventListener('click', (e) => this.switchTab(e));\n    });\n\n    // FAQ accordion — delayed to ensure DOM is ready\n    setTimeout(() => {\n      const faqHeaders = document.querySelectorAll('#faq h3');\n      faqHeaders.forEach(header => {\n        header.style.cursor = 'pointer';\n        header.addEventListener('click', (e) => this.toggleFAQ(e));\n      });\n    }, 100);\n  }\n\n  async loadPayments(email) {\n    try {\n      const response = await fetch(\n        `${this.SUPABASE_URL}/rest/v1/payments?client_email=eq.${encodeURIComponent(email)}`,\n        {\n          method: 'GET',\n          headers: { \n            'apikey': this.SUPABASE_KEY,\n            'Content-Type': 'application/json'\n          }\n        }\n      );\n\n      const data = await response.json();\n      \n      if (response.ok && Array.isArray(data) && data.length > 0) {\n        const payment = data[0];\n        const paymentsDiv = document.getElementById('payments');\n        \n        const totalCost = paymentsDiv.querySelector('[style*=\"Total Cost\"]')?.parentElement;\n        const amountPaid = paymentsDiv.querySelector('[style*=\"Amount Paid\"]')?.parentElement;\n        const balanceDue = paymentsDiv.querySelector('[style*=\"Balance Due\"]')?.parentElement;\n        \n        if (totalCost) {\n          totalCost.querySelector('p:last-child').textContent = '$' + parseFloat(payment.total_cost || 0).toFixed(2);\n        }\n        if (amountPaid) {\n          amountPaid.querySelector('p:last-child').textContent = '$' + parseFloat(payment.amount_paid || 0).toFixed(2);\n        }\n        if (balanceDue) {\n          balanceDue.querySelector('p:last-child').textContent = '$' + parseFloat(payment.balance_due || 0).toFixed(2);\n        }\n      }\n    } catch (err) {\n      console.log('Error loading payments:', err);\n    }\n  }\n\n  async loadDocuments(email) {\n    const documentsList = document.getElementById('documents-list');\n    \n    try {\n      const response = await fetch(\n        `${this.SUPABASE_URL}/rest/v1/documents?client_email=eq.${encodeURIComponent(email)}`,\n        {\n          method: 'GET',\n          headers: { \n            'apikey': this.SUPABASE_KEY,\n            'Content-Type': 'application/json'\n          }\n        }\n      );\n\n      const data = await response.json();\n      \n      if (!response.ok || !Array.isArray(data) || data.length === 0) {\n        documentsList.innerHTML = '<div style=\"grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: rgba(245, 237, 221, 0.5);\"><p style=\"font-size: 14px;\">No documents yet.<\u002Fp><\u002Fdiv>';\n        return;\n      }\n\n      documentsList.innerHTML = '';\n      data.forEach(doc => {\n        const isImage = /\\.(jpg|jpeg|png|gif|webp)$/i.test(doc.url);\n        \n        const card = document.createElement('a');\n        card.href = doc.url;\n        card.target = '_blank';\n        card.rel = 'noopener';\n        card.style.cssText = `display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: rgba(194, 154, 78, 0.08); border: 1px solid rgba(194, 154, 78, 0.16); border-radius: 2px; text-decoration: none; cursor: pointer; transition: all 200ms; min-height: 150px;`;\n        card.onmouseover = () => { card.style.borderColor = '#C29A4E'; card.style.background = 'rgba(194, 154, 78, 0.15)'; };\n        card.onmouseout = () => { card.style.borderColor = 'rgba(194, 154, 78, 0.16)'; card.style.background = 'rgba(194, 154, 78, 0.08)'; };\n        \n        const icon = document.createElement('div');\n        icon.style.cssText = `font-size: 40px; margin-bottom: 12px;`;\n        icon.textContent = isImage ? '🖼️' : '📄';\n        \n        const name = document.createElement('p');\n        name.style.cssText = `font-size: 13px; color: #FBF6EC; text-align: center; word-break: break-word; margin: 0;`;\n        name.textContent = doc.title;\n        \n        card.appendChild(icon);\n        card.appendChild(name);\n        documentsList.appendChild(card);\n      });\n    } catch (err) {\n      documentsList.innerHTML = '<div style=\"grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: rgba(245, 237, 221, 0.5);\"><p style=\"font-size: 14px;\">No documents yet.<\u002Fp><\u002Fdiv>';\n    }\n  }\n\n  toggleFAQ(e) {\n    const answer = e.target.nextElementSibling;\n    if (answer) {\n      answer.style.display = answer.style.display === 'none' ? 'block' : 'none';\n    }\n  }\n\n  switchTab(e) {\n    const tabName = e.target.getAttribute('data-tab');\n    \n    // Hide all tabs\n    document.querySelectorAll('.tab-content').forEach(tab => {\n      tab.style.display = 'none';\n    });\n    \n    // Remove active state from all buttons\n    document.querySelectorAll('.tab-btn').forEach(btn => {\n      btn.classList.remove('active');\n      btn.style.color = 'rgba(245, 237, 221, 0.5)';\n      btn.style.borderBottomColor = 'transparent';\n    });\n    \n    // Show selected tab\n    document.getElementById(tabName).style.display = 'block';\n    \n    // Add active state to clicked button\n    e.target.classList.add('active');\n    e.target.style.color = '#C29A4E';\n    e.target.style.borderBottomColor = '#C29A4E';\n  }\n\n  async handleLogin(e) {\n    e.preventDefault();\n    const email = document.getElementById('email').value.trim();\n    const password = document.getElementById('password').value;\n    const errorMsg = document.getElementById('error-msg');\n\n    errorMsg.style.display = 'none';\n\n    if (!email || !password) {\n      errorMsg.textContent = 'Please enter both email and password.';\n      errorMsg.style.display = 'block';\n      return;\n    }\n\n    try {\n      const response = await fetch(`${this.SUPABASE_URL}/rest/v1/clients?email=eq.${encodeURIComponent(email)}&select=id,full_name,email,password_hash`, {\n        method: 'GET',\n        headers: {\n          'apikey': this.SUPABASE_KEY,\n          'Content-Type': 'application/json',\n        },\n      });\n\n      const data = await response.json();\n\n      if (!response.ok || !data || data.length === 0) {\n        errorMsg.textContent = 'Invalid email or password.';\n        errorMsg.style.display = 'block';\n        return;\n      }\n\n      const client = data[0];\n      \n      const pwResponse = await fetch(`${this.SUPABASE_URL}/rest/v1/rpc/verify_password`, {\n        method: 'POST',\n        headers: {\n          'apikey': this.SUPABASE_KEY,\n          'Content-Type': 'application/json',\n        },\n        body: JSON.stringify({ stored_hash: client.password_hash, provided_password: password }),\n      });\n\n      const pwData = await pwResponse.json();\n\n      if (pwData.match) {\n        const session = { name: client.full_name || email, email: client.email, documents: [] };\n        localStorage.setItem('mc_client_session', JSON.stringify(session));\n        this.setState({ loggedIn: true, clientName: client.full_name || email, clientEmail: email, documents: [] });\n        setTimeout(() => this.loadPayments(email), 500);\n      } else {\n        errorMsg.textContent = 'Invalid email or password.';\n        errorMsg.style.display = 'block';\n      }\n    } catch (err) {\n      errorMsg.textContent = 'Connection error. Please try again.';\n      errorMsg.style.display = 'block';\n    }\n  }\n\n  async loadPayments(email) {\n    try {\n      const url = `${this.SUPABASE_URL}/rest/v1/payments?client_email=eq.${encodeURIComponent(email)}`;\n      console.log('Fetching from:', url);\n      \n      const response = await fetch(url, {\n        method: 'GET',\n        headers: {\n          'apikey': this.SUPABASE_KEY,\n          'Content-Type': 'application/json',\n        },\n      });\n\n      console.log('Response status:', response.status);\n\n      if (!response.ok) {\n        const errText = await response.text();\n        console.error('Fetch failed:', response.status, errText);\n        return;\n      }\n\n      const data = await response.json();\n      console.log('Payments data:', JSON.stringify(data));\n      \n      if (data && Array.isArray(data) && data.length > 0) {\n        const payment = data[0];\n        console.log('Found payment:', payment);\n        const totalEl = document.getElementById('total-cost');\n        const paidEl = document.getElementById('amount-paid');\n        const dueEl = document.getElementById('balance-due');\n        \n        if (totalEl) {\n          totalEl.textContent = `$${parseFloat(payment.total_cost || 0).toFixed(2)}`;\n          console.log('Updated total to:', totalEl.textContent);\n        }\n        if (paidEl) paidEl.textContent = `$${parseFloat(payment.amount_paid || 0).toFixed(2)}`;\n        if (dueEl) dueEl.textContent = `$${parseFloat(payment.balance_due || 0).toFixed(2)}`;\n      } else {\n        console.log('No payment data found for email:', email);\n      }\n    } catch (err) {\n      console.error('Error loading payments:', err.message);\n    }\n  }\n\n  togglePasswordVisibility(e) {\n    e.preventDefault();\n    const passwordInput = document.getElementById('password');\n    const isPassword = passwordInput.type === 'password';\n    passwordInput.type = isPassword ? 'text' : 'password';\n  }\n\n  handleLogout() {\n    localStorage.removeItem('mc_client_session');\n    this.setState({ loggedIn: false, clientName: '', clientEmail: '', documents: [] });\n    document.getElementById('email').value = '';\n    document.getElementById('password').value = '';\n  }\n\n  renderVals() {\n    const { loggedIn, clientName, documents } = this.state;\n\n    if (loggedIn) {\n      document.getElementById('login-screen').style.display = 'none';\n      document.getElementById('dashboard-screen').style.display = 'flex';\n      document.getElementById('client-name').textContent = clientName;\n    } else {\n      document.getElementById('login-screen').style.display = 'flex';\n      document.getElementById('dashboard-screen').style.display = 'none';\n    }\n\n    return { loggedIn, clientName, documents };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
